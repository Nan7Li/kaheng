name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:cf
      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          name = "kaheng"
          payload = {
              "name": name,
              "production_branch": "main",
              "build_config": {
                  "build_command": "npm run build:cf",
                  "destination_dir": "dist",
              },
              "deployment_configs": {
                  "production": {
                      "compatibility_date": "2026-09-10",
                      "compatibility_flags": ["nodejs_compat"],
                      "env_vars": {
                          "NODE_VERSION": {"type": "plain_text", "value": "22"},
                      },
                  },
                  "preview": {
                      "compatibility_date": "2026-09-10",
                      "compatibility_flags": ["nodejs_compat"],
                      "env_vars": {
                          "NODE_VERSION": {"type": "plain_text", "value": "22"},
                      },
                  },
              },
          }

          def req(method, url, data=None):
              request = urllib.request.Request(
                  url,
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
              )
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode()
                  try:
                      parsed = json.loads(body)
                  except json.JSONDecodeError:
                      parsed = {"success": False, "errors": [{"message": body[:500]}]}
                  return err.code, parsed

          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          status, body = req("GET", f"{base}/{name}")
          if status == 200 and body.get("success"):
              print("Pages project kaheng already exists")
              status, body = req("PATCH", f"{base}/{name}", payload)
              print(f"Patched project settings HTTP {status}")
          else:
              status, body = req("POST", base, payload)
              print(f"Created Pages project HTTP {status}")

          if not body.get("success"):
              print(json.dumps({"errors": body.get("errors"), "messages": body.get("messages")}))
              raise SystemExit(1)

          result = body.get("result") or {}
          print("subdomain:", result.get("subdomain"))
          domains = result.get("domains") or []
          if domains:
              print("domains:", ", ".join(domains))
          PY
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=kaheng --commit-dirty=true
