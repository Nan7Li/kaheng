name: List Cloudflare zones

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List zones and Pages domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']

          def req(method, url, data=None):
              request = urllib.request.Request(
                  url,
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
              )
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('Content-Type', 'application/json')
              try:
                  with urllib.request.urlopen(request) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode()
                  try:
                      parsed = json.loads(body)
                  except json.JSONDecodeError:
                      parsed = {'success': False, 'errors': [{'message': body[:500]}]}
                  return err.code, parsed

          print('ACCOUNT', account)
          status, body = req('GET', f'https://api.cloudflare.com/client/v4/zones?account.id={account}&per_page=50')
          print('ZONES_HTTP', status)
          if not body.get('success'):
              print(json.dumps({'errors': body.get('errors'), 'messages': body.get('messages')}))
          zones = body.get('result') or []
          print('ZONE_COUNT', len(zones))
          for z in zones:
              print('ZONE', z.get('name'), z.get('id'), z.get('status'), z.get('type'))
              zid = z.get('id')
              st, recs = req('GET', f'https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?per_page=100')
              print('  RECORDS_HTTP', st)
              for r in recs.get('result') or []:
                  print('  DNS', r.get('type'), r.get('name'), r.get('content'))

          st, pages = req('GET', f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects')
          print('PAGES_HTTP', st)
          for p in pages.get('result') or []:
              print('PAGES', p.get('name'), p.get('subdomain'), p.get('domains'))
          PY
